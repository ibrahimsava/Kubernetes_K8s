apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Valeurs simples (clé: valeur)
  APP_ENV: "dev"
  APP_NAME: "demo-k8s"
  LOG_LEVEL: "info"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: page-config
data:
  # Une clé peut contenir tout un fichier
  index.html: |
    <!DOCTYPE html>
    <html>
      <body>
        <h1>Configuration v1</h1>
        <p>Cette page vient d'un ConfigMap.</p>
      </body>
    </html>