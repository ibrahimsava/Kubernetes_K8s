apiVersion: v1
kind: Pod
metadata:
  name: pvc-demo
spec:
  containers:
    - name: busybox
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "Demarrage : `date`" >> /data/historique.txt
          cat /data/historique.txt
          sleep 3600
      volumeMounts:
        - name: stockage
          mountPath: /data
  volumes:
    - name: stockage
      persistentVolumeClaim:
        claimName: demo-pvc