# Service "headless" (clusterIP: None) : pas d'IP virtuelle,
# le DNS renvoie directement les IP des Pods et donne un nom stable à chaque Pod.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432