# Valeurs par défaut et bornes pour chaque conteneur du namespace dev
apiVersion: v1
kind: LimitRange
metadata:
  name: limites-par-defaut
  namespace: dev
spec:
  limits:
    - type: Container
      defaultRequest:        # appliqué si le conteneur ne déclare pas de requests
        cpu: 50m
        memory: 64Mi
      default:               # appliqué si le conteneur ne déclare pas de limits
        cpu: 100m
        memory: 128Mi
      max:                   # plafond autorisé pour un conteneur
        cpu: "1"
        memory: 512Mi