apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-sante
  labels:
    app: web-sante
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-sante
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web-sante
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80
          # Ressources : requests = réservé, limits = plafond
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # Readiness : le Pod reçoit-il du trafic ?
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
          # Liveness : le Pod est-il vivant, faut-il le redémarrer ?
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web-sante
spec:
  selector:
    app: web-sante
  ports:
    - port: 80
      targetPort: 80