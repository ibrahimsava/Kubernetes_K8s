apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "boutique-web.fullname" . }}
  labels:
    {{- include "boutique-web.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "boutique-web.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "boutique-web.selectorLabels" . | nindent 8 }}
      annotations:
        # Si le ConfigMap change, ce hash change et les Pods sont redéployés
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: {{ include "boutique-web.fullname" . }}
          {{- if .Values.probes.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
