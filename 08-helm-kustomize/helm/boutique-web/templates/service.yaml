apiVersion: v1
kind: Service
metadata:
  name: {{ include "boutique-web.fullname" . }}
  labels:
    {{- include "boutique-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "boutique-web.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
