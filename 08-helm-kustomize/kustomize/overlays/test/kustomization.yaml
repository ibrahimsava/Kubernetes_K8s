apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: test

resources:
  - ../../base
  - namespace.yaml

replicas:
  - name: web
    count: 3

labels:
  - pairs:
      env: test
    includeSelectors: false
    includeTemplates: true

patches:
  - path: patch-resources.yaml

configMapGenerator:
  - name: app-config
    literals:
      - APP_ENV=test
      - LOG_LEVEL=info
