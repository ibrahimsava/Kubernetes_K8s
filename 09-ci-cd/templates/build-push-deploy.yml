# MODÈLE pour ton futur projet Spring Boot (dossier project/).
# Il n'est PAS actif : pour l'utiliser, copie-le dans .github/workflows/ une fois
# que project/ contient un pom.xml, un Dockerfile et des manifests (project/k8s/...).
name: Build, push and deploy

on:
  push:
    branches: [main]
    paths: ['project/**']
  pull_request:
    paths: ['project/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # 1. Compiler et tester (aussi sur les pull requests)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: project
        run: mvn -B verify

  # 2. Construire l'image et la publier sur GitHub Container Registry (pas sur les PR)
  build-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # nécessaire pour publier sur ghcr.io
    outputs:
      image: ${{ steps.vars.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name (lowercase)
        id: vars
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/boutique-api" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./project
          push: true
          # Le tag est le SHA du commit : unique, immuable, traçable
          tags: |
            ${{ steps.vars.outputs.image }}:${{ github.sha }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3. Déployer en dev sur le cluster local, via un runner auto-hébergé (optionnel)
  deploy-dev:
    needs: build-push
    runs-on: [self-hosted, minikube]
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        shell: bash
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}:${{ github.sha }}
        run: |
          kubectl apply -k project/k8s/overlays/dev
          kubectl set image deployment/api api="$IMAGE" -n dev
          kubectl rollout status deployment/api -n dev --timeout=180s

      - name: Roll back on failure
        if: failure()
        shell: bash
        run: kubectl rollout undo deployment/api -n dev

  # 4. Production : s'arrête et attend une validation humaine
  #    (configurer des "required reviewers" sur l'environnement "production")
  deploy-prod:
    needs: [build-push, deploy-dev]
    runs-on: [self-hosted, minikube]
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy
        shell: bash
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}:${{ github.sha }}
        run: |
          kubectl apply -k project/k8s/overlays/prod
          kubectl set image deployment/api api="$IMAGE" -n prod
          kubectl rollout status deployment/api -n prod --timeout=180s

      - name: Roll back on failure
        if: failure()
        shell: bash
        run: kubectl rollout undo deployment/api -n prod